version: 2

models:
  - name: dim_customers
    columns:
      - name: customer_id
        tests: [unique, not_null]
  - name: dim_products
    columns:
      - name: product_id
        tests: [unique, not_null]
  - name: fact_orders
    columns:
      - name: order_id
        tests: [not_null]
      - name: line_total
        tests: [not_null]
  - name: daily_sales
    columns:
      - name: order_date
        tests: [unique, not_null]
