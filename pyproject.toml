[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-etl-pipeline"
version = "1.0.0"
description = "End-to-end batch ETL pipeline for e-commerce orders: CSV to Postgres, with staging and marts modelling, data quality checks, and Airflow orchestration."
authors = [{name = "Karan Kumar Ravella"}]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
